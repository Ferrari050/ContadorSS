<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Nosso Tempo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;

            background: url('img.jpeg') no-repeat center center;
            background-size: 90%;
        }

        .overlay {
            background: rgba(0, 0, 0, 0.5);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }

        h1 {
            margin-bottom: 20px;
            font-size: 2.5rem;
        }

        #contador {
            font-size: 2rem;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="overlay">
        <h1>Já faz</h1>
        <div id="contador">Carregando...</div>
        <h2>Que minha vida é melhor ❤️</h2>
    </div>

    <script>
        function atualizarContador() {
            const dataInicial = new Date('2025-10-17T00:00:00');
            const agora = new Date();

            let diff = agora - dataInicial;

            const segundos = Math.floor(diff / 1000) % 60;
            const minutos = Math.floor(diff / (1000 * 60)) % 60;
            const horas = Math.floor(diff / (1000 * 60 * 60)) % 24;
            const dias = Math.floor(diff / (1000 * 60 * 60 * 24));

            document.getElementById("contador").innerHTML =
                `${dias} dias, ${horas} horas, ${minutos} minutos e ${segundos} segundos`;
        }

        setInterval(atualizarContador, 1000);
        atualizarContador();
    </script>

</body>

</html>
